name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Vue / TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --silent
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: npm run typecheck > typecheck.log 2>&1
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Enforce typecheck
        if: steps.typecheck.outcome == 'failure'
        shell: bash
        run: cat typecheck.log && exit 1
      - run: npm test
      - name: Build frontend
        id: frontend-build
        continue-on-error: true
        shell: bash
        run: npm run build > frontend-build.log 2>&1
      - name: Upload frontend build diagnostics
        if: steps.frontend-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: frontend-build.log
      - name: Enforce frontend build
        if: steps.frontend-build.outcome == 'failure'
        shell: bash
        run: cat frontend-build.log && exit 1

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        id: formatting
        continue-on-error: true
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check > rustfmt.log 2>&1
      - name: Upload formatting diagnostics
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-${{ matrix.os }}
          path: rustfmt.log
      - name: Enforce formatting
        if: steps.formatting.outcome == 'failure'
        shell: bash
        run: cat rustfmt.log && exit 1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Tests
        id: rust-tests
        continue-on-error: true
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --quiet > rust-tests.log 2>&1
      - name: Upload Rust test diagnostics
        if: steps.rust-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-tests-${{ matrix.os }}
          path: rust-tests.log
      - name: Enforce Rust tests
        if: steps.rust-tests.outcome == 'failure'
        shell: bash
        run: cat rust-tests.log && exit 1
      - name: Clippy
        id: rust-clippy
        continue-on-error: true
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --quiet > rust-clippy.log 2>&1
      - name: Upload Clippy diagnostics
        if: steps.rust-clippy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-clippy-${{ matrix.os }}
          path: rust-clippy.log
      - name: Enforce Clippy
        if: steps.rust-clippy.outcome == 'failure'
        shell: bash
        run: cat rust-clippy.log && exit 1
      - name: Compile application
        id: rust-check
        continue-on-error: true
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml --quiet > rust-check.log 2>&1
      - name: Upload Rust compile diagnostics
        if: steps.rust-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-check-${{ matrix.os }}
          path: rust-check.log
      - name: Enforce Rust compilation
        if: steps.rust-check.outcome == 'failure'
        shell: bash
        run: cat rust-check.log && exit 1
